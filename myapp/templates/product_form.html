<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if object %}Редактирование{% else %}Создание{% endif %} товара</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .form-card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 480px;
        }

        .form-card h1 {
            color: #2d3748;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 25px;
            text-align: center;
        }

        /* Стилизация абзацев формы Django */
        .form-card form p {
            margin-bottom: 18px;
        }

        .form-card label {
            display: block;
            font-size: 14px;
            color: #4a5568;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-card input[type="text"],
        .form-card input[type="number"],
        .form-card textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            background-color: #f7fafc;
        }

        .form-card textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-card input:focus,
        .form-card textarea:focus {
            border-color: #667eea;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn-submit {
            flex: 2;
            background: #667eea;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            background: #5a6fd1;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn-cancel {
            flex: 1;
            display: inline-block;
            background: #edf2f7;
            color: #4a5568;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            transition: all 0.3s ease;
        }

        .btn-cancel:hover {
            background: #e2e8f0;
            color: #2d3748;
        }

        .btn-submit:active, .btn-cancel:active {
            transform: scale(0.98);
        }

        /* Ошибки валидации */
        .errorlist {
            list-style: none;
            color: #e74c3c;
            font-size: 13px;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="form-card">
        <h1>{% if object %}Редактировать товар{% else %}Добавить товар{% endif %}</h1>

        <form method="post">
            {% csrf_token %}
            
            {{ form.as_p }}

            <div class="actions">
                <a href="{% url 'product_list' %}" class="btn-cancel">Отмена</a>
                <button type="submit" class="btn-submit">Сохранить</button>
            </div>
        </form>
    </div>

</body>
</html>
